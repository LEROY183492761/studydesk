# 可选：打 tag 时构建 NSIS 安装包并发布 Release。
#
# ⚠️ 说明：
# 1. 本地开发用的是项目内 .toolchain（GNU），CI 用标准 MSVC 工具链；
#    两者都应能编译，但首次启用时请先手动跑一遍确认。
# 2. Tauri 打包在 windows-latest 上约 10–25 分钟；仅 tag 触发，避免浪费额度。
# 3. 需要仓库 Settings → Actions → General 允许 workflow 写 Release（默认可以）。
# 4. 安装包作为 Release 附件，不进 git。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-nsis
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StudyDesk ${{ github.ref_name }}"
          releaseBody: "见仓库 docs/ 下对应版本的 delivery 文档。"
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
