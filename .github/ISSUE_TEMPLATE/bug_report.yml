name: Bug report
description: 报告一个可复现的问题
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索是否已有相同 Issue。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v0.6.0 / commit sha
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 11
        - Windows 10
        - macOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 控制台报错、网络请求失败信息、截图（请脱敏）
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我没有在这个 Issue 中包含密码/Token/真实个人信息
          required: true
